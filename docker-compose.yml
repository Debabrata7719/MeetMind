version: "3.9"

# ─────────────────────────────────────────────────────────────────
#  Meeting Intelligence System — docker-compose
#
#  Services:
#    backend   FastAPI + Uvicorn          (port 8000)
#    frontend  Next.js                   (port 3000)
#    mysql     MySQL 8                   (port 3306, internal only)
#    redis     Redis 7                   (port 6379, internal only)
# ─────────────────────────────────────────────────────────────────

services:

  # ── MySQL ───────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (FastAPI) ────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DB_HOST: mysql
      REDIS_URL: redis://redis:6379
    volumes:
      # Persist uploaded files, vector DB, and generated notes
      - uploads_data:/app/uploads
      - vectordb_data:/app/data/vectordb
      - notes_data:/app/Notes
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Run Alembic migrations then start the server
    command: >
      sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"

  # ── Frontend (Next.js) ───────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
  uploads_data:
  vectordb_data:
  notes_data:
