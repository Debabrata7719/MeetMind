version: '3.8'

services:
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

  backend:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis
    restart: always

  worker:
    build: .
    command: celery -A src.infrastructure.workers.celery_app worker -P solo -l INFO
    env_file:
      - .env
    depends_on:
      - redis
    restart: always

  beat:
    build: .
    command: celery -A src.infrastructure.workers.celery_app beat -l INFO
    env_file:
      - .env
    depends_on:
      - redis
    restart: always
