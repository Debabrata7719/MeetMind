name: CI

on:
  push:
    branches: ["**"]        # runs on every push to any branch
  pull_request:
    branches: [main]        # runs on every PR targeting main

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    # ── Spin up MySQL and Redis as service containers ──────────────
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: Meeting_analizer_user
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -ptestpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      # ── 1. Checkout code ────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Set up Python 3.13 ───────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-lean.txt

      # ── 3. Install FFmpeg & PortAudio ───────────────────────────
      - name: Install FFmpeg & PortAudio
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libportaudio2 portaudio19-dev

      # ── 4. Install Python dependencies ─────────────────────────
      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements-lean.txt

      # ── 5. Create uploads folder and download tiny test video ───
      - name: Download tiny test video
        run: |
          mkdir -p uploads
          curl -L -o uploads/test_video.mp4 https://github.com/holderdeord/holderdeord/raw/master/spec/fixtures/files/1sec.mp4

      # ── 6. Write a minimal .env for tests ──────────────────────
      - name: Create test .env
        run: |
          cat > .env << EOF
          GROQ_API_KEY=
          DB_HOST=127.0.0.1
          DB_USER=root
          DB_PASSWORD=testpassword
          DB_NAME=Meeting_analizer_user
          JWT_SECRET_KEY=ci-test-secret-key-not-real
          JWT_ALGORITHM=HS256
          JWT_EXPIRE_HOURS=24
          REDIS_URL=redis://localhost:6379
          CORS_ORIGINS=http://localhost:3000
          ENV=development
          EMAIL_ADDRESS=test@test.com
          EMAIL_APP_PASSWORD=testpassword
          RETRY_MAX_ATTEMPTS=3
          RETRY_INITIAL_DELAY=5
          RETRY_MAX_DELAY=300
          RETRY_BACKOFF_FACTOR=2.0
          EOF

      # ── 7. Run Alembic migrations ───────────────────────────────
      - name: Run DB migrations
        run: alembic upgrade head

      # ── 8. Run tests ────────────────────────────────────────────
      - name: Run tests
        run: pytest tests/ -v -s -p no:warnings --ignore=tests/test_services.py
